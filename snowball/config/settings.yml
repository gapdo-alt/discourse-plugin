plugins:
  snowball_enabled:
    default: true
    client: true
  snowball_verified_group:
    default: "verified-employees"
    client: false
    description: "验证通过后加入的群组名称"
  snowball_trust_level:
    default: 2
    min: 0
    max: 4
    client: false
    description: "验证通过后的信任等级（0 表示不调整）"
  snowball_show_nav_link:
    default: true
    client: true
  snowball_daily_attempt_limit:
    default: 3
    min: 0
    max: 100
    client: false
    description: "每个用户每天最多可发起的验证次数（0 表示不限制）"
  snowball_weekly_attempt_limit:
    default: 3
    min: 0
    max: 100
    client: false
    description: "每个用户每周最多可发起的验证次数（0 表示不限制）"
  snowball_validity_days:
    default: 180
    min: 0
    max: 3650
    client: false
    description: "验证有效期（天）。超过后自动移出验证群组；0 表示永不过期"
  snowball_expired_group:
    default: ""
    client: false
    description: "验证过期后移入的群组名称（留空表示只移出、不加入其它群组）"
  snowball_seed_questions:
    default: 3
    min: 0
    max: 9
    client: false
    description: "每份验证里的种子题数量（0~9，来自种子库）"
  snowball_probe_questions:
    default: 2
    min: 0
    max: 9
    client: false
    description: "每份验证里的探测题数量（0~9，随机工号，用于补充观察库）"
  snowball_pass_threshold:
    default: 2
    min: 0
    max: 9
    client: false
    description: "通过验证需要答对的种子题数量（0~9；不能大于种子题数量，否则永远无法通过）"
  snowball_block_size:
    default: 1000
    min: 10
    max: 1000000
    client: false
    description: "区块粒度：同一份验证的工号取自同一个该大小的号段。100=只差后2位，1000=只差后3位，10000=只差后4位"
