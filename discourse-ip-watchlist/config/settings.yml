# A dedicated settings category (instead of "plugins") gives the plugin a proper
# display name: Discourse derives the admin title from the translated category
# label (admin.site_settings.categories.ip_watchlist -> "IP watchlist"), whereas
# the fallback humanises the plugin directory name into "Ip watchlist".
ip_watchlist:
  ip_watchlist_enabled:
    default: true
    client: true
  ip_watchlist_org_keywords:
    default: "huawei|hw cloud|HUAWEI CLOUDS"
    type: list
    list_type: simple
  ip_watchlist_hostname_keywords:
    default: "hwclouds-dns"
    type: list
    list_type: simple
  ip_watchlist_referrer_patterns:
    default: ""
    type: list
    list_type: simple
  ip_watchlist_retention_days:
    default: 90
    min: 0
    max: 3650
